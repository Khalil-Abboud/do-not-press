name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build game
        run: |
          sed -i 's|src="/audio/monkeys-spinning-monkeys.mp3"|src={`${import.meta.env.BASE_URL}audio/monkeys-spinning-monkeys.mp3`}|' src/App.jsx
          npm run build -- --base /do-not-press/
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages
